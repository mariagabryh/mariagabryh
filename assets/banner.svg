<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Maria Clara — inicialização do sistema">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.6" stop-color="#070B18"/>
      <stop offset="1" stop-color="#0D0619"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#8A5CFF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .log{font-size:13px;fill:#6F8FA3;opacity:0;animation:in .35s ease-out forwards}
    .ok{fill:#00F0FF}
    .hi{fill:#FF2BD6}
    .l1{animation-delay:.2s}.l2{animation-delay:.6s}.l3{animation-delay:1s}.l4{animation-delay:1.4s}.l5{animation-delay:1.8s}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}

    .name{opacity:0;animation:appear .7s ease-out 2.2s forwards}
    @keyframes appear{0%{opacity:0}20%{opacity:.8}30%{opacity:.1}45%{opacity:1}55%{opacity:.4}100%{opacity:1}}
    .gc,.gm{opacity:0;animation:glitch 5s steps(1) 3s infinite}
    .gm{animation-delay:3.08s}
    @keyframes glitch{0%{opacity:0}2%{opacity:.7;transform:translate(-4px,1px)}4%{opacity:0;transform:none}52%{opacity:0}53%{opacity:.6;transform:translate(3px,-1px)}55%{opacity:0;transform:none}100%{opacity:0}}
    .sub{opacity:0;animation:in .6s ease-out 2.8s forwards}

    .bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:load 2.1s cubic-bezier(.6,0,.2,1) .2s forwards}
    @keyframes load{to{transform:scaleX(1)}}
    .init{animation:out .3s ease-in 2.4s forwards}
    @keyframes out{to{opacity:0}}
    .ready{opacity:0;animation:in .4s ease-out 2.5s forwards}

    .ring{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
    .ring2{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .scanline{animation:scan 6s linear infinite}
    @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(420px)}}
    .blink{animation:blink 1.1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <!-- fundo -->
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>
  <ellipse cx="600" cy="230" rx="520" ry="170" fill="url(#halo)"/>
  <rect class="scanline" x="0" y="0" width="1200" height="110" fill="url(#scan)"/>

  <!-- cantos HUD -->
  <g fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.7">
    <path d="M24 60V24H60"/><path d="M1140 24H1176V60"/>
    <path d="M24 340V376H60"/><path d="M1176 340V376H1140"/>
  </g>

  <!-- log de boot -->
  <g class="mono">
    <text x="56" y="62"  class="log l1">&gt; MARIA_CLARA.SYS boot sequence v2026.10 ...... <tspan class="ok">[ OK ]</tspan></text>
    <text x="56" y="84"  class="log l2">&gt; Carregando módulos: HTML · CSS · JS ........... <tspan class="ok">[ OK ]</tspan></text>
    <text x="56" y="106" class="log l3">&gt; Compilando: JAVA · PYTHON · C++ ............... <tspan class="ok">[ OK ]</tspan></text>
    <text x="56" y="128" class="log l4">&gt; Modo aprendizado contínuo ...................... <tspan class="hi">[ ATIVO ]</tspan></text>
    <text x="56" y="150" class="log l5">&gt; Identidade verificada: <tspan class="ok">MARIA CLARA</tspan></text>
  </g>

  <!-- HUD circular -->
  <g transform="translate(1068 112)">
    <circle r="62" fill="none" stroke="#00F0FF" stroke-opacity="0.15"/>
    <circle class="ring" r="52" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="40 14 6 14" stroke-opacity="0.85"/>
    <circle class="ring2" r="40" fill="none" stroke="#FF2BD6" stroke-width="2" stroke-dasharray="70 30" stroke-opacity="0.85"/>
    <circle r="27" fill="#00F0FF" fill-opacity="0.06" stroke="#00F0FF" stroke-opacity="0.5"/>
    <text y="6" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#E6FBFF">M.C</text>
  </g>

  <!-- nome -->
  <g class="sans" font-size="68" font-weight="800" letter-spacing="10" text-anchor="middle">
    <text x="600" y="236" class="gc" fill="#00F0FF">MARIA CLARA</text>
    <text x="600" y="236" class="gm" fill="#FF2BD6">MARIA CLARA</text>
    <text x="600" y="236" class="name" fill="url(#neon)" filter="url(#glow)">MARIA CLARA</text>
  </g>
  <text x="600" y="282" text-anchor="middle" class="mono sub" font-size="16" letter-spacing="5" fill="#9FB3C8">DEV EM FORMAÇÃO  //  CÓDIGO · CURIOSIDADE · EVOLUÇÃO</text>

  <!-- barra de carregamento -->
  <g class="mono" font-size="12">
    <text x="56" y="330" class="init" fill="#6F8FA3">INICIALIZANDO NÚCLEO...</text>
    <text x="56" y="330" class="ready" fill="#00F0FF">SISTEMA ONLINE ✓</text>
    <text x="1144" y="330" text-anchor="end" fill="#6F8FA3">BUILD 2026.10</text>
  </g>
  <rect x="56" y="340" width="1088" height="4" rx="2" fill="#0F1B2D"/>
  <rect class="bar" x="56" y="340" width="1088" height="4" rx="2" fill="url(#neon)"/>
  <g class="mono" font-size="12" fill="#6F8FA3">
    <circle class="blink" cx="62" cy="362" r="4" fill="#00FF9C"/>
    <text x="74" y="366">STATUS: ONLINE</text>
    <text x="1144" y="366" text-anchor="end">LOC: BRASIL · UPLINK SEGURO</text>
  </g>
</svg>

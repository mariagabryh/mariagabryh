<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Objetivos atuais em formato de terminal">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FF2BD6"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:15px}
    .ln{opacity:0;animation:in .3s ease-out forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.1s}.d4{animation-delay:1.5s}.d5{animation-delay:1.9s}.d6{animation-delay:2.3s}.d7{animation-delay:2.7s}.d8{animation-delay:3.3s}.d9{animation-delay:3.9s}
    @keyframes in{from{opacity:0}to{opacity:1}}
    .fill{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.6,0,.2,1) forwards}
    .f3{animation-delay:1.2s}.f4{animation-delay:1.6s}.f5{animation-delay:2s}.f6{animation-delay:2.4s}.f7{animation-delay:2.8s}
    @keyframes grow{to{transform:scaleX(1)}}
    .cur{animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .p{fill:#FF2BD6}.c{fill:#00F0FF}.t{fill:#C9D1D9}.g{fill:#5C6F84}.ok{fill:#00FF9C}
  </style>

  <rect x="1" y="1" width="898" height="378" rx="14" fill="#070B14" stroke="#00F0FF" stroke-opacity="0.25"/>
  <path d="M1 15a14 14 0 0 1 14-14h870a14 14 0 0 1 14 14v23H1z" fill="#0C1324"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F57"/><circle cx="44" cy="20" r="6" fill="#FEBC2E"/><circle cx="64" cy="20" r="6" fill="#28C840"/>
  <text x="450" y="25" text-anchor="middle" class="mono" font-size="13" fill="#5C6F84">mclara@nexus: ~/missao</text>

  <g class="mono">
    <text x="24" y="72" class="ln d1"><tspan class="p">mclara@nexus</tspan><tspan class="g">:</tspan><tspan class="c">~/missao</tspan><tspan class="t">$ cat objetivos_atuais.log</tspan></text>
    <text x="24" y="102" class="ln d2 g">// carregando objetivos... nível atual: básico → subindo de nível</text>

    <!-- objetivos -->
    <g class="ln d3"><rect x="24" y="126" width="140" height="10" rx="5" fill="#13203A"/><rect class="fill f3" x="24" y="126" width="84" height="10" rx="5" fill="url(#neon)"/>
      <text x="180" y="136" class="c">60%</text><text x="236" y="136" class="t">Dominar a base: HTML, CSS e JavaScript</text></g>
    <g class="ln d4"><rect x="24" y="158" width="140" height="10" rx="5" fill="#13203A"/><rect class="fill f4" x="24" y="158" width="56" height="10" rx="5" fill="url(#neon)"/>
      <text x="180" y="168" class="c">40%</text><text x="236" y="168" class="t">Lógica e Orientação a Objetos com Java</text></g>
    <g class="ln d5"><rect x="24" y="190" width="140" height="10" rx="5" fill="#13203A"/><rect class="fill f5" x="24" y="190" width="49" height="10" rx="5" fill="url(#neon)"/>
      <text x="180" y="200" class="c">35%</text><text x="236" y="200" class="t">Automatizar tarefas e explorar IA com Python</text></g>
    <g class="ln d6"><rect x="24" y="222" width="140" height="10" rx="5" fill="#13203A"/><rect class="fill f6" x="24" y="222" width="42" height="10" rx="5" fill="url(#neon)"/>
      <text x="180" y="232" class="c">30%</text><text x="236" y="232" class="t">Algoritmos e estruturas de dados em C++</text></g>
    <g class="ln d7"><rect x="24" y="254" width="140" height="10" rx="5" fill="#13203A"/><rect class="fill f7" x="24" y="254" width="35" height="10" rx="5" fill="url(#neon)"/>
      <text x="180" y="264" class="c">25%</text><text x="236" y="264" class="t">Publicar meus primeiros projetos no GitHub</text></g>

    <text x="24" y="308" class="ln d8"><tspan class="p">mclara@nexus</tspan><tspan class="g">:</tspan><tspan class="c">~/missao</tspan><tspan class="t">$ ./iniciar_missao --modo=foco</tspan></text>
    <text x="24" y="340" class="ln d9"><tspan class="ok">✔</tspan><tspan class="t"> Missão em andamento: um commit de cada vez.</tspan></text>
    <rect class="cur ln d9" x="440" y="327" width="10" height="17" fill="#00F0FF"/>
  </g>
</svg>
